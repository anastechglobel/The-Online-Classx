    <!-- Focus Timer Modal -->
    <div id="focusTimerModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[2000] hidden flex flex-col justify-center items-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-[32px] overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800 p-8 flex flex-col items-center relative">
            <button onclick="closeFocusTimer()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="w-16 h-16 bg-indigo-50 dark:bg-indigo-900/30 rounded-2xl flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-6">
                <i class="fa-solid fa-stopwatch text-3xl"></i>
            </div>
            
            <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Focus Mode</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 text-center mb-8">Boost your productivity with the Pomodoro technique. Study without distractions!</p>
            
            <div class="relative w-48 h-48 rounded-full border-[8px] border-slate-100 dark:border-slate-800 flex items-center justify-center mb-8 shadow-inner">
                <div id="timerDisplay" class="text-5xl font-black text-slate-800 dark:text-white tracking-tighter tabular-nums">25:00</div>
            </div>
            
            <div class="flex gap-4 mb-8">
                <button onclick="setTimerDuration(25)" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">25m</button>
                <button onclick="setTimerDuration(50)" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">50m</button>
                <button onclick="setTimerDuration(5)" class="px-4 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 text-xs font-bold text-emerald-600 dark:text-emerald-400 transition-colors">Break</button>
            </div>
            
            <div class="flex gap-3 w-full">
                <button id="btnStartTimer" onclick="startFocusTimer()" class="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-xs hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200 dark:shadow-none">Start</button>
                <button id="btnPauseTimer" onclick="pauseFocusTimer()" class="hidden flex-1 bg-amber-500 text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-xs hover:bg-amber-600 transition-colors shadow-lg shadow-amber-200 dark:shadow-none">Pause</button>
                <button onclick="resetFocusTimer()" class="w-14 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 py-4 rounded-2xl flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>
    </div>
