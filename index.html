<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Online Classes | Premier EdTech Learning Portal</title>
    <meta name="description" content="The Online Classes is a full-featured EdTech platform for live classes, structured courses, study notes, and test series.">
    <meta property="og:title" content="The Online Classes | Premier EdTech Learning Portal">
    <meta property="og:description" content="The Online Classes is a full-featured EdTech platform for live classes, structured courses, study notes, and test series.">
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TOC App">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Fonts: Plus Jakarta Sans, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons: FontAwesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 & Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Cashfree & Razorpay Payment Gateway SDKs -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Tailwind CSS Runtime Config for Dynamic Utility Classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        secondary: { 500: '#0ea5e9', 600: '#0284c7' },
                        accent: { 500: '#f59e0b' }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(15, 23, 42, 0.07)',
                        'glow': '0 0 25px rgba(79, 70, 229, 0.35)'
                    }
                }
            }
        }
    </script>
    <script>
        window.__deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.__deferredPwaPrompt = e;
            if (typeof window.updateInstallAppUI === 'function') {
                window.updateInstallAppUI();
            }
        });
        window.addEventListener('appinstalled', function() {
            window.__deferredPwaPrompt = null;
            if (typeof window.updateInstallAppUI === 'function') {
                window.updateInstallAppUI();
            }
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
        }
    </script>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
