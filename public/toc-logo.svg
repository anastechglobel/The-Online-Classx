<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary Royal Indigo & Deep Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Inner Shield Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradient for Cap, Star, and Crest Rim -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Luminous Cyan-White Page Gradient -->
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <linearGradient id="pageGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <!-- Royal Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Rounded App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#centerGlow)" />

  <!-- Outer Subtle Gold Luxury Border -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-opacity="0.45" />

  <!-- Academic Crest Shield Outline -->
  <path d="M256 64 L396 112 L396 248 C396 346 332 418 256 448 C180 418 116 346 116 248 L116 112 Z"
        fill="#0f172a" fill-opacity="0.45" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.65" filter="url(#dropShadow)" />

  <!-- Rising Sunburst Rays of Knowledge -->
  <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="88" x2="256" y2="106" />
    <line x1="196" y1="104" x2="206" y2="120" />
    <line x1="316" y1="104" x2="306" y2="120" />
    <line x1="158" y1="138" x2="173" y2="148" />
    <line x1="354" y1="138" x2="339" y2="148" />
  </g>

  <!-- Graduation Mortarboard (Cap) at Crown -->
  <g filter="url(#dropShadow)">
    <!-- Cap Top Diamond -->
    <polygon points="256,104 374,154 256,204 138,154" fill="url(#goldGrad)" />
    <polygon points="256,112 356,154 256,196 156,154" fill="#1e1b4b" />
    <polygon points="256,118 344,154 256,190 168,154" fill="url(#goldGrad)" opacity="0.92" />
    <!-- Cap Center Button -->
    <ellipse cx="256" cy="154" rx="12" ry="6" fill="#1e1b4b" />
    <!-- Cap Skull Cap Base -->
    <path d="M198 183 L198 214 C198 228 224 240 256 240 C288 240 314 228 314 214 L314 183 L256 208 Z"
          fill="#312e81" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Golden Tassel -->
    <path d="M256 154 Q325 162 348 198 L348 228" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="348" cy="232" r="7" fill="url(#goldGrad)" />
  </g>

  <!-- Open Illuminated Book of Knowledge -->
  <g filter="url(#dropShadow)">
    <!-- Back Gold Cover -->
    <path d="M136 246 Q196 232 256 262 Q316 232 376 246 L376 346 Q316 332 256 362 Q196 332 136 346 Z"
          fill="url(#goldGrad)" />
    <!-- Left Page -->
    <path d="M144 236 Q200 222 253 254 L253 350 Q200 320 144 334 Z"
          fill="url(#pageGradLeft)" />
    <!-- Right Page -->
    <path d="M368 236 Q312 222 259 254 L259 350 Q312 320 368 334 Z"
          fill="url(#pageGradRight)" />
    <!-- Subtle Page Lines -->
    <path d="M164 262 Q204 254 238 274" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
    <path d="M164 282 Q204 274 238 294" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
    <path d="M164 302 Q204 294 238 314" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />

    <path d="M348 262 Q308 254 274 274" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
    <path d="M348 282 Q308 274 274 294" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
    <path d="M348 302 Q308 294 274 314" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
  </g>

  <!-- Brand Monogram Badge ('TOC') -->
  <g filter="url(#dropShadow)">
    <rect x="136" y="346" width="240" height="78" rx="24" fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="4" />
    <text x="256" y="399" text-anchor="middle" fill="#ffffff" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="48" letter-spacing="5">TOC</text>
  </g>

  <!-- Three Golden Stars at Bottom Apex -->
  <g fill="url(#goldGrad)">
    <circle cx="232" cy="442" r="4" />
    <circle cx="256" cy="446" r="5.5" />
    <circle cx="280" cy="442" r="4" />
  </g>
</svg>
